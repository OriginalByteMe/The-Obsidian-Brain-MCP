[project]
name = "obsidian-brain-mcp"
version = "0.2.0"
description = "MCP server for intelligent Obsidian vault interaction via Obsidian CLI"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Noah R" }
]
keywords = ["mcp", "obsidian", "knowledge-management", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0",
]

[project.scripts]
obsidian-brain = "obsidian_brain.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obsidian_brain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Live-vault tests (tests/test_live_*.py) talk to a real Obsidian and a disposable vault
# named by OBSIDIAN_TEST_VAULT, so they never run by accident: opt in with `pytest -m obsidian`.
addopts = "-m 'not obsidian'"
markers = ["obsidian: live test against the real Obsidian CLI and a disposable test vault"]

[tool.mypy]
python_version = "3.12"
strict = true
