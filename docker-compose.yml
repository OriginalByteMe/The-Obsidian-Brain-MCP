version: '3.8'

services:
  obsidian-brain:
    build: .
    container_name: obsidian-brain-mcp
    environment:
      - OBSIDIAN_API_KEY=${OBSIDIAN_API_KEY}
      - OBSIDIAN_HOST=${OBSIDIAN_HOST:-host.docker.internal}
      - OBSIDIAN_PORT=${OBSIDIAN_PORT:-27124}
      - OBSIDIAN_VERIFY_SSL=${OBSIDIAN_VERIFY_SSL:-false}
    extra_hosts:
      # Allow container to reach host machine (where Obsidian runs)
      - "host.docker.internal:host-gateway"
    # Required for stdio transport (MCP communication)
    stdin_open: true
    tty: true
    restart: unless-stopped
